name: Backup PostgreSQL

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    name: Dump and Encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Supavisor pooler (session mode) — the direct "db.<ref>.supabase.co" host
      # is IPv6-only and unreachable from GitHub-hosted runners (no IPv6 egress).
      PGHOST: aws-0-eu-west-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: nyc-restaurant-hygiene-z-qd-p
          env-slug: prod
          export-type: env

      - name: Install PostgreSQL 17 client
        # ubuntu-latest ships postgresql-client 16, but Supabase runs Postgres 17;
        # pg_dump refuses to dump from a newer server. Pull the matching client
        # from the official PGDG apt repo instead.
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          # Pooler requires the project-scoped username, not the bare role name.
          PGUSER: postgres.dcdssfzpxuejwznuossj
          PGPASSWORD: ${{ env.SPRING_DATASOURCE_PASSWORD }}
        run: pg_dump --format=plain > backup.sql

      - name: Encrypt dump
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$BACKUP_GPG_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.sql.gpg backup.sql
          rm backup.sql

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup.sql.gpg
          retention-days: 30
